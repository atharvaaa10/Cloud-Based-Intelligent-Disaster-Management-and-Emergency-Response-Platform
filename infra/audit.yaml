AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Audit infrastructure for Disaster Management Platform:
  AWS CloudTrail single-region management event trail, delivering to a secured S3 audit log bucket
  with public access block, AES256 encryption, least-privilege bucket policy, and a 90-day lifecycle rule.
  Free Tier compliant: AWS delivers the first copy of management events free of charge.

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment name prefix for resources

Resources:
  # ── S3 Audit Logs Bucket ──────────────────────────────────────
  # Cost: Free Tier includes 5 GB standard S3 storage for 12 months.
  #       90-day expiration rule ensures minimal storage footprint.
  AuditLogsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "disaster-platform-audit-logs-${AWS::AccountId}-${EnvironmentName}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAuditLogsAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub "disaster-platform-audit-logs-${EnvironmentName}"
        - Key: Project
          Value: DisasterResponse

  # ── S3 Bucket Policy for CloudTrail ───────────────────────────
  # Grants cloudtrail.amazonaws.com permissions to write audit logs
  AuditLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AuditLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AuditLogsBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/disaster-platform-mgmt-trail-${EnvironmentName}"

          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${AuditLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/disaster-platform-mgmt-trail-${EnvironmentName}"

  # ── AWS CloudTrail Trail ──────────────────────────────────────
  # Cost: $0.00 / month - AWS provides the first copy of management events free in each region.
  ManagementTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - AuditLogsBucketPolicy
    Properties:
      TrailName: !Sub "disaster-platform-mgmt-trail-${EnvironmentName}"
      IsLogging: true
      IsMultiRegionTrail: false
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      S3BucketName: !Ref AuditLogsBucket
      Tags:
        - Key: Name
          Value: !Sub "disaster-mgmt-trail-${EnvironmentName}"
        - Key: Project
          Value: DisasterResponse

Outputs:
  AuditLogsBucketName:
    Description: Name of the dedicated S3 bucket storing CloudTrail audit logs
    Value: !Ref AuditLogsBucket
    Export:
      Name: !Sub "${AWS::StackName}-AuditLogsBucketName"

  AuditLogsBucketArn:
    Description: ARN of the dedicated S3 bucket storing CloudTrail audit logs
    Value: !GetAtt AuditLogsBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AuditLogsBucketArn"

  CloudTrailName:
    Description: Name of the active management CloudTrail
    Value: !Ref ManagementTrail
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailName"

  CloudTrailArn:
    Description: ARN of the active management CloudTrail
    Value: !GetAtt ManagementTrail.Arn
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailArn"
