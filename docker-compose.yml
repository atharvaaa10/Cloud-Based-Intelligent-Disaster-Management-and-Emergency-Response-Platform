version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: disaster_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: disaster_user
      POSTGRES_PASSWORD: disaster_pass
      POSTGRES_DB: disaster_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
